name: NixOS installer

on:
  pull_request:
    paths:
      - nixos-installer/**
      - .github/workflows/nixos-installer.yml
  push:
    branches:
      - main
    paths:
      - nixos-installer/**
      - .github/workflows/nixos-installer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build installer ISO
        run: |
          nix build \
            --print-build-logs \
            --out-link result \
            ./nixos-installer#nixosConfigurations.installer.config.system.build.isoImage

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mapfile -t isos < <(find result/iso -maxdepth 1 -type f -name '*.iso')
          if [[ "${#isos[@]}" -ne 1 ]]; then
            printf 'Expected one ISO, found %s\n' "${#isos[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          cp "${isos[0]}" dist/nixos-installer-x86_64-linux.iso
          (
            cd dist
            sha256sum nixos-installer-x86_64-linux.iso \
              >nixos-installer-x86_64-linux.iso.sha256
          )

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixos-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish installer release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nixos-installer-release
      cancel-in-progress: false

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nixos-installer
          path: dist

      - name: Verify installer artifact
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check nixos-installer-x86_64-linux.iso.sha256

      - name: Publish verified release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: nixos-installer-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eEuo pipefail
          cleanup() {
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          }
          trap cleanup ERR
          trap 'cleanup; exit 1' INT TERM

          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "NixOS installer" \
            --notes "Automated verified installer build." \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
          trap - ERR INT TERM
