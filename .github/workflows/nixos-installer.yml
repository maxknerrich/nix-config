name: NixOS installer

on:
  pull_request:
    paths:
      - nixos-installer/**
      - flake.nix
      - flake.lock
      - .github/workflows/nixos-installer.yml
  push:
    branches:
      - main
    paths:
      - nixos-installer/**
      - flake.nix
      - flake.lock
      - .github/workflows/nixos-installer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build installer ISO
        run: |
          nix build \
            --print-build-logs \
            --out-link result \
            .#nixosConfigurations.installer.config.system.build.isoImage

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mapfile -t isos < <(find result/iso -maxdepth 1 -type f -name '*.iso')
          if [[ "${#isos[@]}" -ne 1 ]]; then
            printf 'Expected one ISO, found %s\n' "${#isos[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          cp "${isos[0]}" dist/nixos-installer-x86_64-linux.iso
          (
            cd dist
            sha256sum nixos-installer-x86_64-linux.iso \
              >nixos-installer-x86_64-linux.iso.sha256
          )

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixos-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish rolling release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: nixos-installer
          path: dist

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: nixos-installer-latest
        run: |
          set -euo pipefail
          notes="Installer built from commit ${GITHUB_SHA}."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true \
              >/dev/null
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Latest NixOS installer" \
              --notes "$notes" \
              --latest
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Latest NixOS installer" \
              --notes "$notes" \
              --latest
          fi
