name: Configuration checks

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - hosts/**
      - home/**
      - modules/**
      - justfile
      - .github/workflows/check.yml
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - hosts/**
      - home/**
      - modules/**
      - justfile
      - .github/workflows/check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Evaluate all host configurations
        run: nix shell --inputs-from . nixpkgs#just --command just check
